async function unlock(){
  const pass=document.getElementById('pw').value;const err=document.getElementById('err');err.textContent="";
  try{
    const raw=Uint8Array.from(atob(ENC),c=>c.charCodeAt(0));
    const salt=raw.slice(8,16),ct=raw.slice(16);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
    const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},km,384));
    const key=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct);
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(e){err.textContent="合言葉が違うようです。もう一度お試しください。";}
}
